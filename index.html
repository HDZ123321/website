<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="郝大章的个人主页">
  <title>郝大章 | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="#home">PORTFOLIO</a>
    <nav>
      <a href="#home" class="active">HOME</a>
      <a href="#biography">BIOGRAPHY</a>
      <a href="#about">ABOUT ME</a>
    </nav>
  </header>

  <main id="home" class="hero">
    <div class="hero-copy">
      <p class="eyebrow">WELCOME TO MY SPACE</p>
      <h1>Hello<br>everyone！</h1>
      <p class="welcome">欢迎来到我的网站！</p>
      <div class="accent-line"></div>

      <div class="actions">
        <a class="btn" href="#about">About Me</a>
        <a class="text-link" href="#biography">Biography</a>
      </div>
    </div>

    <div class="hero-photo">
      <div class="photo-glow"></div>
      <img src="assets/hero.jpg" alt="个人照片">
      <div class="photo-fade"></div>
    </div>
  </main>

  <section id="biography" class="section">
    <p class="section-label">BIOGRAPHY</p>
    <h2>我的故事，慢慢写。</h2>
    <p>
      这里以后可以加入教育经历、实习经历、项目经历，以及值得记录的重要节点。
    </p>
  </section>

  <section id="about" class="section">
    <p class="section-label">ABOUT ME</p>
    <h2>很高兴你来到这里。</h2>
    <p>
      这里以后可以加入个人简介、技能、作品、联系方式、简历下载等内容。
    </p>
  </section>

  <footer>
    <p>© 2026 郝大章 · Portfolio</p>
  </footer>
</body>
</html>
